<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 600' width='1000' height='600'>
  <defs>
    <linearGradient id='bakeryBg' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#0f172a'/>
      <stop offset='100%' stop-color='#1e1b4b'/>
    </linearGradient>
    <linearGradient id='pinkGrad' x1='0' y1='0' x2='1' y2='0'>
      <stop offset='0%' stop-color='#ec4899'/>
      <stop offset='100%' stop-color='#f43f5e'/>
    </linearGradient>
    <linearGradient id='goldGrad' x1='0' y1='0' x2='1' y2='0'>
      <stop offset='0%' stop-color='#f59e0b'/>
      <stop offset='100%' stop-color='#fbbf24'/>
    </linearGradient>
  </defs>
  <rect width='1000' height='600' fill='url(#bakeryBg)'/>

  <!-- Top Nav -->
  <rect width='1000' height='70' fill='rgba(15,23,42,0.8)'/>
  <rect y='69' width='1000' height='1' fill='rgba(255,255,255,0.1)'/>
  <circle cx='50' cy='35' r='18' fill='url(#pinkGrad)'/>
  <text x='50' y='41' font-family='system-ui, sans-serif' font-size='16' font-weight='bold' fill='#fff' text-anchor='middle'>🥐</text>
  <text x='80' y='41' font-family='system-ui, sans-serif' font-size='20' font-weight='bold' fill='#ffffff'>Bella Artisan Bakery</text>

  <rect x='790' y='20' width='170' height='36' rx='18' fill='url(#pinkGrad)'/>
  <text x='875' y='43' font-family='system-ui, sans-serif' font-size='13' font-weight='bold' fill='#ffffff' text-anchor='middle'>Order Online (Pick/Delivery)</text>

  <!-- Main Hero -->
  <text x='50' y='140' font-family='system-ui, sans-serif' font-size='14' font-weight='bold' fill='#f472b6' letter-spacing='2'>FRESHLY BAKED IN BRIDGEPORT</text>
  <text x='50' y='190' font-family='system-ui, sans-serif' font-size='42' font-weight='800' fill='#ffffff'>Artisan Pastries &amp;</text>
  <text x='50' y='240' font-family='system-ui, sans-serif' font-size='42' font-weight='800' fill='url(#pinkGrad)'>Custom AI Cake Builder</text>
  <text x='50' y='285' font-family='system-ui, sans-serif' font-size='16' fill='#94a3b8'>Design custom cakes online with instant visual previews and automated online pickup scheduling.</text>

  <!-- Product Showcase Cards -->
  <rect x='50' y='320' width='280' height='220' rx='20' fill='rgba(255,255,255,0.05)' stroke='rgba(255,255,255,0.1)'/>
  <rect x='70' y='340' width='240' height='100' rx='12' fill='rgba(236,72,153,0.2)'/>
  <text x='190' y='395' font-family='system-ui, sans-serif' font-size='28' text-anchor='middle'>🎂 Custom AI Cake</text>
  <text x='70' y='465' font-family='system-ui, sans-serif' font-size='16' font-weight='bold' fill='#ffffff'>Build Your Cake</text>
  <text x='70' y='490' font-family='system-ui, sans-serif' font-size='13' fill='#ec4899'>Instant 3D Preview &amp; Pricing &rarr;</text>

  <rect x='360' y='320' width='280' height='220' rx='20' fill='rgba(255,255,255,0.05)' stroke='rgba(255,255,255,0.1)'/>
  <rect x='380' y='340' width='240' height='100' rx='12' fill='rgba(245,158,11,0.2)'/>
  <text x='500' y='395' font-family='system-ui, sans-serif' font-size='28' text-anchor='middle'>🥐 Fresh Cannoli Box</text>
  <text x='380' y='465' font-family='system-ui, sans-serif' font-size='16' font-weight='bold' fill='#ffffff'>Daily Dozen Box</text>
  <text x='380' y='490' font-family='system-ui, sans-serif' font-size='13' fill='#fbbf24'>Order for Today 4.99 &rarr;</text>

  <rect x='670' y='320' width='280' height='220' rx='20' fill='rgba(255,255,255,0.05)' stroke='rgba(255,255,255,0.1)'/>
  <rect x='690' y='340' width='240' height='100' rx='12' fill='rgba(16,185,129,0.2)'/>
  <text x='810' y='395' font-family='system-ui, sans-serif' font-size='28' text-anchor='middle'>☕ Espresso &amp; Drinks</text>
  <text x='690' y='465' font-family='system-ui, sans-serif' font-size='16' font-weight='bold' fill='#ffffff'>Coffee Subscriptions</text>
  <text x='690' y='490' font-family='system-ui, sans-serif' font-size='13' fill='#34d399'>9/mo Unlimited Brews &rarr;</text>
</svg>