  <rect x='50' y='310' width='240' height='100' rx='16' fill='url(#glass)' stroke='rgba(255,255,255,0.1)'/>
  <text x='70' y='345' font-family='system-ui, sans-serif' font-size='24' fill='#38bdf8'>★ 4.9/5.0</text>
  <text x='70' y='380' font-family='system-ui, sans-serif' font-size='13' fill='#cbd5e1'>Based on 350+ Google Reviews</text>

  <rect x='310' y='310' width='240' height='100' rx='16' fill='url(#glass)' stroke='rgba(255,255,255,0.1)'/>
  <text x='330' y='345' font-family='system-ui, sans-serif' font-size='24' fill='#34d399'>⚡ 45 Min</text>
