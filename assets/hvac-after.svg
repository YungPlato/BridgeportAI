  <rect x='640' y='390' width='280' height='48' rx='14' fill='url(#blueGrad)'/>
  <text x='780' y='420' font-family='system-ui, sans-serif' font-size='15' font-weight='bold' fill='#ffffff' text-anchor='middle'>Calculate Price Now &rarr;</text>
  <text x='780' y='465' font-family='system-ui, sans-serif' font-size='12' fill='#64748b' text-anchor='middle'>100% Free • No Phone Call Required</text>
